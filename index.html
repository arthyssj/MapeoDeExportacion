<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Caja</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="icon" type="image/png" href="./IMG/icon.png">
</head>
<body>
    <header>
        <h1>Generador de Caja</h1>
    </header>

    <main id="app-container">
        <section id="panel-controles">
            <div class="input-group">
                <label for="inputCaja">Caja</label>
                <input type="text" id="inputCaja" placeholder="Escanea o ingresa el número de caja" autofocus>
            </div>
            <div class="input-group">
                <label for="inputMaterial">Material</label>
                <input type="text" id="inputMaterial" placeholder="Escanea número de parte">
            </div>
            <div class="input-group">
                <label for="inputCantidad">Cantidad</label>
                <input type="number" id="inputCantidad" placeholder="Escanea o ingresa cantidad">
            </div>

            <div class="acciones">
                <button id="btnExportar" class="btn-primary">Exportar</button>
                <button id="btnCancelar" class="btn-danger">Cancelar</button>
            </div>

            <div class="resumen">
                <div class="resumen-cifras">
                    <div class="cifra">
                        <h2>Total Tarimas</h2>
                        <span id="contadorTarimas" class="numero-verde">0</span>
                    </div>
                    <div class="cifra">
                        <h2>Total Piezas</h2>
                        <span id="contadorPiezas" class="numero-azul">0</span>
                    </div>
                </div>

                <div class="resumen-materiales">
                    <h3>Resumen por material</h3>
                    <div class="tabla-scroll">
                        <table id="tabla-resumen">
                            <thead>
                                <tr>
                                    <th>Material</th>
                                    <th>Tarimas</th>
                                    <th>Piezas</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-resumen"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <section id="panel-trailer">
            <div class="cabina-trailer">Frente del Tráiler</div>
            <div id="mapa-trailer" class="trailer-grid">
                </div>
            <div class="puertas-trailer">Puertas</div>
        </section>
    </main>

    <!-- SheetJS (generador de Excel). Se intenta desde el CDN con "async" para que la falta
         de internet no retrase la carga de la app. Si no llega a cargar, script.js recurre
         automáticamente a la copia local en ./JS/xlsx.full.min.js -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js" async></script>
    <script src="./JS/script.js"></script>
</body>
</html>
