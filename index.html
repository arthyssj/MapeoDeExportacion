<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeo de Exportacion</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="icon" type="image/png" href="./IMG/icon_2.png">
    <script>
        // Se aplica ANTES de pintar la página para que no haya un parpadeo de tema
        // al cargar. Si no hay preferencia guardada, se usa la del sistema operativo.
        (function () {
            var guardado = null;
            try { guardado = localStorage.getItem('generadorCajaTema'); } catch (e) {}
            var prefiereClaro = window.matchMedia
                && window.matchMedia('(prefers-color-scheme: light)').matches;
            document.documentElement.setAttribute(
                'data-theme',
                guardado || (prefiereClaro ? 'claro' : 'oscuro')
            );
        })();
    </script>
</head>
<body>
    <header>
        <h1>Mapeo de Exportacion</h1>
        <button id="btnTema" class="btn-tema" type="button" aria-label="Cambiar tema">☀</button>

        <!-- Avance de llenado de la caja. Cubre exactamente el borde inferior del
             encabezado, así que no añade altura ni desplaza nada. El máximo lo pone
             script.js desde MAX_CAPACIDAD, para no repetir aquí el número. -->
        <div id="progresoTrailer" class="header-progreso" role="progressbar"
             aria-valuemin="0" aria-valuenow="0" aria-label="Posiciones ocupadas del tráiler">
            <div id="progresoTrailerRelleno" class="header-progreso-relleno"></div>
        </div>
    </header>

    <!-- Avisos no bloqueantes (reemplazan a los alert()). aria-live los anuncia sin
         robar el foco, que durante la captura tiene que quedarse en el campo. -->
    <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

    <main id="app-container">
        <section id="panel-controles">
            <div class="input-group">
                <label for="inputCaja">Titulo/Transporte/Unidad</label>
                <input type="text" id="inputCaja" placeholder="Ingresa título, transporte o unidad" autofocus>
            </div>
            <div class="input-group">
                <label for="inputMaterial">Material</label>
                <input type="text" id="inputMaterial" placeholder="Escanea número de parte">
            </div>
            <div class="input-group">
                <label for="inputCantidad">Cantidad</label>
                <input type="number" id="inputCantidad" placeholder="Escanea o ingresa cantidad">
            </div>
            <div class="input-group">
                <label for="inputReferencia">Referencia</label>
                <input type="text" id="inputReferencia" placeholder="Escanea o ingresa referencia">
            </div>

            <div class="acciones">
                <button id="btnExportar" class="btn-primary">Exportar</button>
                <button id="btnCancelar" class="btn-danger">Cancelar</button>
            </div>

            <div class="resumen">
                <div class="resumen-cifras">
                    <div class="cifra">
                        <h2>Total Tarimas</h2>
                        <span id="contadorTarimas" class="numero-verde">0</span>
                    </div>
                    <div class="cifra">
                        <h2>Total Piezas</h2>
                        <span id="contadorPiezas" class="numero-azul">0</span>
                    </div>
                </div>

                <div class="resumen-materiales">
                    <h3>Resumen por material</h3>
                    <div class="tabla-scroll">
                        <table id="tabla-resumen">
                            <thead>
                                <tr>
                                    <th>Material</th>
                                    <th>Tarimas</th>
                                    <th>Piezas</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-resumen"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <section id="panel-trailer">
            <div class="cabina-trailer">Frente del Tráiler</div>
            <div id="mapa-trailer" class="trailer-grid">
                <!-- Estado vacío. Va dentro del grid pero fuera de su flujo (absolute),
                     así no ocupa una celda ni desordena la colocación de las tarimas.
                     Sólo se ve mientras no hay nada escaneado, así que no compite con
                     el trabajo: desaparece en cuanto entra la primera tarima. -->
                <div class="trailer-vacio">
                    <svg class="tarima-fantasma" viewBox="0 0 64 44" width="76" height="52"
                         role="presentation" focusable="false" aria-hidden="true">
                        <rect x="2"  y="3"  width="60" height="7" rx="1.5"/>
                        <rect x="2"  y="14" width="60" height="7" rx="1.5"/>
                        <rect x="4"  y="25" width="10" height="9" rx="1.5"/>
                        <rect x="27" y="25" width="10" height="9" rx="1.5"/>
                        <rect x="50" y="25" width="10" height="9" rx="1.5"/>
                        <rect x="2"  y="36" width="60" height="6" rx="1.5"/>
                    </svg>
                    <p class="trailer-vacio-titulo">Tráiler vacío</p>
                    <p class="trailer-vacio-pista">Escanea un material para colocar la primera tarima</p>
                </div>
            </div>
            <div class="puertas-trailer">Puertas</div>
        </section>
    </main>

    <!-- SheetJS (generador de Excel), servido SIEMPRE desde la copia del repo.
         Antes se bajaba del CDN con la copia local sólo como respaldo, pero el CDN no
         aportaba nada: la copia ya viaja en el repo (misma versión, 0.20.0) y la app
         tiene que funcionar sin internet en el almacén. A cambio, un <script> externo
         sin comprobación de integridad podía ejecutar código arbitrario con acceso a
         todo lo escaneado si ese CDN se comprometía. Un archivo propio no tiene ese
         problema y además arranca sin depender de la red.
         "defer" para no bloquear el dibujado: son casi 1 MB y no hacen falta hasta
         que alguien pulse Exportar. -->
    <script src="./JS/xlsx.full.min.js" defer></script>
    <script src="./JS/script.js"></script>
</body>
</html>
